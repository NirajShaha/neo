server:
  port: 8080

spring:
  application:
    name: neo-backend
  config:
    # Local runs (mvn spring-boot:run from apps/backend) pick up the repo-root .env; absent in containers.
    import: optional:file:../../.env[.properties]
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/neo?createDatabaseIfNotExist=true&nullDatabaseMeansCurrent=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:manager}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          time_zone: UTC
    open-in-view: false
  jackson:
    serialization:
      write-dates-as-timestamps: false

flowable:
  database-schema-update: true
  async-executor-activate: true
  async-executor-default-async-job-acquire-wait-time: 1s
  async-executor-default-timer-job-acquire-wait-time: 1s
  history-level: full
  idm:
    enabled: false
  process:
    definition-cache-limit: 128

neo:
  security:
    okta:
      # Okta authorization-server issuer, e.g. https://your-org.okta.com/oauth2/default (required)
      issuer: ${OKTA_ISSUER:}
      audience: ${OKTA_AUDIENCE:api://default}
      email-claim: ${OKTA_EMAIL_CLAIM:email}
      name-claim: ${OKTA_NAME_CLAIM:name}
      groups-claim: ${OKTA_GROUPS_CLAIM:groups}
      # Okta groups are the source of truth for local group membership (disable to manage groups in NEO instead)
      sync-groups: ${OKTA_SYNC_GROUPS:true}
      auto-provision: ${OKTA_AUTO_PROVISION:true}
      clock-skew-seconds: ${OKTA_CLOCK_SKEW_SECONDS:60}
      # Okta group name -> NEO group key. Unlisted names are used as-is.
      # group-mappings:
      #   NEO-Finance: finance
  seed:
    demo-users: ${NEO_SEED_DEMO_USERS:false}
  finance-threshold: ${FINANCE_THRESHOLD:1000}
  manager-reminder-duration: ${MANAGER_REMINDER_DURATION:PT48H}
  manager-escalation-duration: ${MANAGER_ESCALATION_DURATION:PT120H}
  storage-dir: ${STORAGE_DIR:./storage}
  workflow:
    claim-process-key: ${CLAIM_PROCESS_KEY:}
    sync-enabled: ${WORKFLOW_SYNC_ENABLED:true}
    git-uri: ${WORKFLOW_GIT_URI:https://github.com/NirajShaha/bpmn-config-repo.git}
    git-branch: ${WORKFLOW_GIT_BRANCH:main}
    git-local-dir: ${WORKFLOW_GIT_LOCAL_DIR:./storage/workflow-source}
    process-directory: ${WORKFLOW_PROCESS_DIRECTORY:./storage/processes}
    sync-interval-ms: ${WORKFLOW_SYNC_INTERVAL_MS:30000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
