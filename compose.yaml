services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-manager}
      MYSQL_DATABASE: neo
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./apps/backend/infra/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping --host=127.0.0.1 --user=root --password=\"$${MYSQL_ROOT_PASSWORD}\" --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/neo?createDatabaseIfNotExist=true&nullDatabaseMeansCurrent=true"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-manager}
      OKTA_ISSUER: ${OKTA_ISSUER:?Set OKTA_ISSUER in .env (see .env.example)}
      OKTA_AUDIENCE: ${OKTA_AUDIENCE:-api://default}
      OKTA_GROUPS_CLAIM: ${OKTA_GROUPS_CLAIM:-groups}
      OKTA_SYNC_GROUPS: ${OKTA_SYNC_GROUPS:-true}
      OKTA_AUTO_PROVISION: ${OKTA_AUTO_PROVISION:-true}
      NEO_SEED_DEMO_USERS: ${NEO_SEED_DEMO_USERS:-false}
      STORAGE_DIR: /data/storage
      WORKFLOW_GIT_LOCAL_DIR: /data/workflow-source
      WORKFLOW_PROCESS_DIRECTORY: /data/workflows
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - backend_storage:/data/storage
      - workflow_source:/data/workflow-source
      - workflow_processes:/data/workflows

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        BACKEND_URL: http://backend:8080
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:8080
      APP_URL: ${APP_URL:-http://localhost:3000}
      NEO_SESSION_SECRET: ${NEO_SESSION_SECRET:?Set NEO_SESSION_SECRET in .env (min 32 chars)}
      OKTA_ISSUER: ${OKTA_ISSUER:?Set OKTA_ISSUER in .env (see .env.example)}
      OKTA_CLIENT_ID: ${OKTA_CLIENT_ID:?Set OKTA_CLIENT_ID in .env}
      OKTA_CLIENT_SECRET: ${OKTA_CLIENT_SECRET:?Set OKTA_CLIENT_SECRET in .env}
      OKTA_SCOPES: ${OKTA_SCOPES:-openid profile email groups offline_access}
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  mysql_data:
  backend_storage:
  workflow_source:
  workflow_processes:
